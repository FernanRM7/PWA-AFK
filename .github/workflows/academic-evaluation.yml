name: Academic Evaluation - W08

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install clean dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit, integration, and existing Vitest tests
        run: npm run test:vitest
      - name: Starter tests
        run: npm run test:starter
      - name: E2E tests (when supplied by the W08 E2E contribution)
        if: ${{ hashFiles('tests/e2e/**') != '' }}
        run: npm run test:e2e
      - name: Production build
        run: npm run build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w08-test-results
          path: |
            reports/vitest-junit.xml
            coverage/
          if-no-files-found: warn
          retention-days: 14
