# Generated by engineering-professor. This workflow is formative feedback.
# Do not use a student-editable workflow as the sole final grading authority.
name: Academic Evaluation Feedback — Semana 05 Sync Data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
      - name: AC-01 - Instalación limpia y build completan.
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          npm run build
      - name: AC-02 - Los artefactos declarados para la actividad existen.
        shell: bash
        run: |
          set -euo pipefail
          test -e 'src/lib/sync/queue.ts'
          test -e 'src/lib/storage/schema.ts'
          test -e 'src/lib/sync/conflict-policy.ts'
          test -e 'docs/sync-policy.md'
          test -e 'tests/sync.spec.ts'
          test -f README.md
          test -f evidence/individual.md
      - name: AC-03 - Las pruebas reproducibles pasan.
        shell: bash
        run: |
          set -euo pipefail
          npm test
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w05-sync-data
          if-no-files-found: ignore
          path: |
            evaluation-result.json
            coverage/
            test-results/
