# Generated by engineering-professor. This workflow is formative feedback.
# Do not use a student-editable workflow as the sole final grading authority.
name: Academic Evaluation Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup 1
        shell: bash
        run: |
          set -euo pipefail
            npm ci --no-audit --no-fund
          - name: AC-01 - La aplicación compila.
        shell: bash
        run: |
          set -euo pipefail
            npm run build
          - name: AC-02 - La cola persistente y sus pruebas existen.
        shell: bash
        run: |
          set -euo pipefail
            test -e 'src/lib/sync/queue.ts' && test -e 'src/lib/storage/schema.ts' && test -e 'tests/queue.spec.ts'
          - name: AC-03 - Las pruebas pasan.
        shell: bash
        run: |
          set -euo pipefail
          npm test
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w05-sync-data
          if-no-files-found: ignore
          path: |
            evaluation-result.json
            coverage/
            test-results/
