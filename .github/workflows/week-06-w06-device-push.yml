name: Academic Evaluation Feedback - W06 Device Capabilities

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: AC-01 - Instalación limpia y build completan.
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
      - name: AC-02 - Los artefactos declarados para W06 existen.
        shell: bash
        run: |
          set -euo pipefail
          test -f 'src/lib/device/camera.ts'
          test -f 'src/lib/device/geolocation.ts'
          test -f 'src/lib/notifications/client.ts'
          test -f 'docs/capabilities.md'
          test -f 'tests/capabilities.spec.ts'
          test -f 'README.md'
          test -f 'src/app/inspecciones/page.tsx'
          test -f 'tests/camera.spec.ts'
          test -f 'tests/geolocation.spec.ts'
          test -f 'evidence/individual.md'
      - name: AC-03 - Las pruebas reproducibles pasan.
        shell: bash
        run: |
          set -euo pipefail
          npm test
      - name: AC-04 - La evidencia requerida está presente.
        shell: bash
        run: |
          set -euo pipefail
          test -f 'README.md'
          test -f 'evidence/individual.md'
